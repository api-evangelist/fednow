actions:
  openApiHarvested: false
  reason: |
    No open, self-serve public API and no publicly downloadable OpenAPI/Swagger
    exist for the FedNow Service. The four FedNow REST APIs are gated behind
    FedLine credentials and the ISO 20022 message specifications are gated
    behind SWIFT MyStandards. An honest identity + docs-pointer record was
    created; nothing was fabricated and no spec files were saved.
