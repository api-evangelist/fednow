- aid: fednow:fednow-account-balance-api
  name: FedNow Account Balance API
  description: Account Management API letting a participating financial institution
    programmatically retrieve its FedNow master account balance information. Documented
    on the FedLine Developer portal as one of the optional FedNow REST APIs; access
    is gated to enrolled institutions and no public OpenAPI is published.
