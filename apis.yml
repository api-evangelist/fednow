- aid: fednow:fednow-participant-list-api
  name: FedNow Participant List API
  description: Service Management API returning the current list of FedNow Service
    participants so an institution can confirm reachable routing endpoints before
    sending a payment. Documented on the FedLine Developer portal as an optional FedNow
    REST API; access is gated to enrolled institutions and no public OpenAPI is published.
