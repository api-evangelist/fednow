name: FedNow Service
kind: company
description: >-
  The FedNow Service is an instant payments rail operated by the Federal Reserve
  Banks, launched in July 2023 to move funds between U.S. financial institutions in
  real time, 24 hours a day, 365 days a year, with immediate interbank settlement in
  central bank money. It is ISO 20022 native and is one of three domestic U.S. rails
  alongside The Clearing House's RTP network and the ACH network. FedNow is a scheme
  operator, not a consumer-facing PSP; participating banks and credit unions connect
  over FedLine (Direct or Advantage), exchange ISO 20022 messages for customer credit
  transfers, requests for payment, liquidity transfers and system/account reporting,
  and may optionally use a small set of FedNow REST APIs (Account Balance, Network
  Intelligence, Participant List, Ping) exposed through the credential-gated FedLine
  Developer portal. Its public developer surface is documentation- and rulebook-first:
  ISO 20022 message specifications live behind SWIFT MyStandards and API access is
  restricted to enrolled institutions, so there is no open, self-serve public API.
