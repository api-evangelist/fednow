- aid: fednow:fednow-iso-20022-message-specifications
  name: FedNow ISO 20022 Message Specifications
  description: The core scheme messaging surface of the FedNow Service. FedNow is ISO
    20022 native and defines message types for customer credit transfers, requests
    for payment, interbank liquidity transfers, and system/account reporting. The
    current message specifications, implementation guide, message flows, and readiness/testing
